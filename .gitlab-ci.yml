# The checks of scripts/check.sh on every push and merge request; on the default branch and on tags
# the Docker image (built with PGO), pushed to the project's container registry when it has one:
# :<short sha>, and :latest (default branch) or :<version> (tag vX.Y.Z).

stages: [check, image]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/target
  CARGO_TERM_COLOR: always

.rust:
  stage: check
  image: rust:1-slim-bookworm
  interruptible: true
  cache:
    key: $CI_JOB_NAME
    paths: [.cargo/registry/, target/]

fmt:
  extends: .rust
  cache: []
  script:
    - rustup component add rustfmt
    - cargo fmt --check

clippy:
  extends: .rust
  script:
    - rustup component add clippy
    - cargo clippy --locked --all-targets -- -D warnings
    # The optional modules (rate-limit) left out: the core builds on its own.
    - cargo clippy --locked --all-targets --no-default-features -- -D warnings

test:
  extends: .rust
  script:
    - cargo test --locked

# Cargo.toml's rust-version.
msrv:
  extends: .rust
  image: rust:1.88-slim-bookworm
  script:
    - cargo test --locked

deny:
  extends: .rust
  # The full image: cargo-deny fetches the advisory database with git.
  image: rust:1-bookworm
  cache:
    key: deny
    paths: [.cargo/registry/, .cargo/bin/]
  script:
    - test -x .cargo/bin/cargo-deny || cargo install --locked cargo-deny --version 0.20.2
    - cargo deny check

image:
  stage: image
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker build -t "webfast:$CI_COMMIT_SHORT_SHA" .
    - |
      if [ -z "$CI_REGISTRY_IMAGE" ]; then
        echo "no container registry for this project: the image is built, not pushed"
        exit 0
      fi
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      tags="$CI_COMMIT_SHORT_SHA"
      if [ -n "$CI_COMMIT_TAG" ]; then tags="$tags ${CI_COMMIT_TAG#v}"; else tags="$tags latest"; fi
      for tag in $tags; do
        docker tag "webfast:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$tag"
        docker push "$CI_REGISTRY_IMAGE:$tag"
      done
