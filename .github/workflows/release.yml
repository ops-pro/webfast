# The image and the binaries, for x86-64 and arm64, each built on a runner of its architecture
# (profile-guided optimisation trains the build under a load, which emulation would make slow and
# unrepresentative). The image goes to ghcr.io/<owner>/webfast as one multi-arch manifest: tagged
# sha-<commit> on every push to main, and on a tag vX.Y.Z also X.Y.Z and latest. The binaries are
# static (musl) and, on a tag, published as release assets with checksums. The same build in the
# layout of the official caddy image goes out as the -caddy tags. The build with every module (the
# cargo feature ngfw-crs on top of the defaults: the OWASP CRS in the request filter) goes out as
# the -full and -full-caddy tags and, on a tag, as webfast-full-* binaries. Every artifact gets a
# provenance attestation (SLSA, Sigstore); a release also an SBOM attestation.
name: Release

on:
  push:
    branches: [main, dev-ci]
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}
  # The cargo features the -full build adds to the defaults: every module that is not one.
  FULL_FEATURES: ngfw-crs

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # The binary: static, with PGO (pgo/build.sh trains the instrumented build on this runner).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: build the binary
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: -Ctarget-feature=+crt-static
        run: sh pgo/build.sh out
      - name: name and check it
        id: binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) version="${GITHUB_SHA::7}" ;; esac
          name="webfast-$version-${{ matrix.target }}"
          ./out/webfast --version
          file out/webfast
          tar -C out -czf "$name.tar.gz" webfast
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.binary.outputs.name }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: |
            ${{ steps.binary.outputs.name }}.tar.gz
            ${{ steps.binary.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

      # The image for this architecture, pushed by digest; the manifest job names it.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push the image by digest
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      # The Caddy-compatible layout of the same build (Dockerfile, target caddy): the build stage
      # comes from the cache the first image filled.
      - name: build and push the caddy image by digest
        id: caddy
        uses: docker/build-push-action@v6
        with:
          context: .
          target: caddy
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.caddy.outputs.digest }}
          push-to-registry: true

      # The build with every module (-full): the image, its Caddy-compatible layout and its binary,
      # the last two from the build stage the first one filled (a cache scope of its own, so the
      # default build's is not replaced).
      - name: build and push the full image by digest
        id: full
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: WEBFAST_FEATURES=${{ env.FULL_FEATURES }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}-full
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-full
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.full.outputs.digest }}
          push-to-registry: true
      - name: build and push the full caddy image by digest
        id: full_caddy
        uses: docker/build-push-action@v6
        with:
          context: .
          target: caddy
          build-args: WEBFAST_FEATURES=${{ env.FULL_FEATURES }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}-full
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.full_caddy.outputs.digest }}
          push-to-registry: true
      - name: the full binary
        uses: docker/build-push-action@v6
        with:
          context: .
          target: binary
          build-args: WEBFAST_FEATURES=${{ env.FULL_FEATURES }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=out-full
          cache-from: type=gha,scope=${{ matrix.arch }}-full
      - name: name and check the full binary
        id: full_binary
        run: |
          name="webfast-full-${{ steps.binary.outputs.version }}-${{ matrix.target }}"
          ./out-full/webfast --version
          file out-full/webfast
          tar -C out-full -czf "$name.tar.gz" webfast
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.full_binary.outputs.name }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: binary-full-${{ matrix.arch }}
          path: |
            ${{ steps.full_binary.outputs.name }}.tar.gz
            ${{ steps.full_binary.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

      - name: keep the digests for the manifests
        run: |
          # Named by the hex alone: upload-artifact refuses a colon in a file name.
          keep() { mkdir -p "digests/$1"; touch "digests/$1/${2#sha256:}"; }
          keep webfast "${{ steps.image.outputs.digest }}"
          keep caddy "${{ steps.caddy.outputs.digest }}"
          keep webfast-full "${{ steps.full.outputs.digest }}"
          keep caddy-full "${{ steps.full_caddy.outputs.digest }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error

  # One multi-arch manifest per variant, tagged as the header says with the variant's suffix.
  manifest:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: webfast
            suffix: ''
          - variant: caddy
            suffix: -caddy
          - variant: webfast-full
            suffix: -full
          - variant: caddy-full
            suffix: -full-caddy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: suffix=${{ matrix.suffix }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: one manifest for both architectures
        working-directory: digests/${{ matrix.variant }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: what was published
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, manifest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: assets
          merge-multiple: true
      - name: software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: webfast-${{ github.ref_name }}.spdx.json
          artifact-name: sbom
      - uses: actions/attest-sbom@v2
        with:
          subject-path: assets/*.tar.gz
          sbom-path: webfast-${{ github.ref_name }}.spdx.json
      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes: the version's section of CHANGELOG.md (a tag without one fails), then where
        # the image and binaries are.
        run: |
          cp webfast-${{ github.ref_name }}.spdx.json assets/
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## $version " 'index($0, head) == 1 { on = 1; next } on && /^## / { exit } on' \
            CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          image="${{ env.IMAGE }}"
          page="https://github.com/$GITHUB_REPOSITORY/pkgs/container/${image##*/}"
          {
            printf '\n---\n\n### Images\n\n'
            printf 'linux/amd64 and linux/arm64, on [ghcr.io](%s):\n\n' "$page"
            printf -- '- webfast: [`%s:%s`](%s)\n' "$image" "$version" "$page"
            printf -- '- in the layout of the official caddy image: [`%s:%s-caddy`](%s)\n' "$image" "$version" "$page"
            printf -- '- with every module, the OWASP CRS in the request filter too: [`%s:%s-full`](%s), [`%s:%s-full-caddy`](%s)\n\n' \
              "$image" "$version" "$page" "$image" "$version" "$page"
            printf '```sh\n'
            for suffix in '' -caddy -full -full-caddy; do printf 'docker pull %s:%s%s\n' "$image" "$version" "$suffix"; done
            printf '```\n\n'
            printf 'With the CRS (the -full images and webfast-full-* binaries) the filter runs it, and its built-in sets are off but `cve` unless its file names them.\n\n'
            printf 'Binaries: static (musl), with provenance and SBOM attestations (`gh attestation verify`); webfast-full-* with every module.\n'
          } >> notes.md
          gh release create "${{ github.ref_name }}" assets/* \
            --title "webfast ${{ github.ref_name }}" \
            --notes-file notes.md \
            --verify-tag
