# The checks of scripts/check.sh on every push and pull request: formatting, clippy on both crates
# of the workspace with every feature and with each alone, the tests on x86-64 and arm64, the tests on the minimum Rust
# (Cargo.toml's rust-version), cargo-deny (advisories, licenses, bans, sources), and the ACME flow
# against Pebble.
name: CI

on:
  push:
    branches: [main, dev-ci]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: every feature, both crates
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: no extension and no module
        run: |
          cargo clippy --locked -p webfast-core --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p webfast --all-targets --no-default-features -- -D warnings
      - name: each of the core's extensions alone
        run: |
          for feature in mimalloc rate-limit proxy-cache jwt api-firewall compress-files acme fetch test-harness; do
            echo "::group::$feature"
            cargo clippy --locked -p webfast-core --all-targets --no-default-features --features "$feature" -- -D warnings
            echo "::endgroup::"
          done
      - name: each of the binary's modules alone, and the filter with the CRS engine
        run: |
          for feature in ngfw challenge ngfw-crs; do
            echo "::group::$feature"
            cargo clippy --locked -p webfast --all-targets --no-default-features --features "$feature" -- -D warnings
            echo "::endgroup::"
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: the minimum Rust, from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Automatic certificates against Pebble, Let's Encrypt's test CA (tests/acme.rs): an account,
  # an order, the certificate served, the files reused at a restart. Never against a real CA.
  acme:
    runs-on: ubuntu-24.04
    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:latest
        env:
          PEBBLE_VA_ALWAYS_VALID: 1
          PEBBLE_WFE_NONCEREJECT: 0
        ports:
          - 14000:14000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pebble's own root certificate (for its HTTPS; the same file in every Pebble image)
        run: curl -sSfo pebble.minica.pem https://raw.githubusercontent.com/letsencrypt/pebble/main/test/certs/pebble.minica.pem
      - run: cargo test --locked -p webfast-core --test acme -- --nocapture
        env:
          WEBFAST_PEBBLE_ROOT: ${{ github.workspace }}/pebble.minica.pem
          WEBFAST_PEBBLE_DIRECTORY: https://localhost:14000/dir
