[workspace]
resolver = "2"
members = ["crates/webfast-core", "crates/webfast"]
default-members = ["crates/webfast"]

[workspace.package]
version = "0.1.5"
edition = "2024"
# let chains (`if let … && let …`): 1.88; serde-saphyr: 1.89.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ops-pro/webfast"
publish = false

# The versions every crate of the workspace uses (a crate names what it needs with
# `workspace = true`); the comments on why a crate is there are in crates/webfast-core/Cargo.toml.
[workspace.dependencies]
webfast-core = { path = "crates/webfast-core", default-features = false }
ahash = "0.8"
anyhow = "1"
arc-swap = "1"
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
blake3 = "1"
brotli = "8"
bytes = "1"
flate2 = { version = "1", features = ["zlib-rs"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "aws-lc-rs", "webpki-roots", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "client-legacy", "http1", "http2"] }
instant-acme = { version = "0.8", default-features = false, features = ["aws-lc-rs", "rcgen", "time"] }
ipnet = "2"
jsonschema = { version = "0.60", default-features = false }
libc = "0.2"
libmimalloc-sys = { version = "0.1", features = ["extended"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "checked-decode"] }
mimalloc = { version = "0.1", default-features = false }
percent-encoding = "2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1"
rustc-hash = "2"
rustls = { version = "0.23", features = ["brotli", "zlib"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
walkdir = "2"
zstd = "0.14"

[profile.release]
# One codegen unit and whole-program LTO: slower builds, faster code (measured in README.md).
codegen-units = 1
lto = "fat"
strip = "symbols"

# The modules (webfast-modules) depend on webfast-core by git; in this workspace that is the crate
# next to them, so there is one core, not two: the trait the modules implement is the one the
# binary composes. Cargo.lock keeps the modules' commit.
[patch."https://github.com/ops-pro/webfast"]
webfast-core = { path = "crates/webfast-core" }
