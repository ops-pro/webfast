[package]
name = "webfast"
version = "0.1.0"
edition = "2024"
# let chains (`if let … && let …`).
rust-version = "1.88"
description = "A static-first web server: the site from memory with content-hash ETags, precompressed and on-the-fly br/zstd/gzip, reverse proxy, HTTP/1.1, HTTP/2 and HTTP/3; configured with a strict subset of the Caddyfile"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["http", "web-server", "static", "caddyfile", "http3"]
categories = ["web-programming::http-server"]
publish = false

[lib]
name = "webfast"
path = "src/lib.rs"

[[bin]]
name = "webfast"
path = "src/main.rs"

[features]
default = ["mimalloc", "rate-limit", "proxy-cache"]
# `rate_limit`: requests per key and window, in the caddy-ratelimit plugin's syntax (src/ratelimit.rs).
rate-limit = []
# `cache`: proxied responses kept in memory, in the cache-handler plugin's syntax (src/cache.rs).
proxy-cache = []
# mimalloc as the global allocator of the binary (and of examples/bench.rs) instead of the system's.
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dependencies]
anyhow = "1"
# The site files and ready answers as snapshots replaced whole when files change (src/watch.rs);
# requests load them without counting references.
arc-swap = "1"
# SHA-256 of the files that may be compression dictionaries (src/files.rs); already the TLS
# backend, with the same features as rustls asks for.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
blake3 = "1"
brotli = "8"
bytes = "1"
flate2 = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "client-legacy", "http1", "http2"] }
ipnet = "2"
# Files kept in memory as LZ4 blocks (src/files.rs): the fast codec, with bounds-checked decoding.
# mi_collect: threads that worked at startup give their free memory back (src/lib.rs).
libmimalloc-sys = { version = "0.1", optional = true, features = ["extended"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "checked-decode"] }
mimalloc = { version = "0.1", default-features = false, optional = true }
percent-encoding = "2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
regex = "1"
rustc-hash = "2"
rustls = "0.23"
serde_json = "1"
# Socket options for the listening TCP and UDP sockets (src/sockets.rs).
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
walkdir = "2"
zstd = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
# TCP_DEFER_ACCEPT, which socket2 does not cover.
libc = "0.2"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"
tokio-stream = "0.1"

[profile.release]
# One codegen unit and whole-program LTO: slower builds, faster code (measured in README.md).
codegen-units = 1
lto = "fat"
strip = "symbols"
