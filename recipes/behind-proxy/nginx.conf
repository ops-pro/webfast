# nginx in front of webfast (behind-proxy/Caddyfile) on the same host: TLS here, the requests passed
# on over kept-alive connections with the original Host and the client's address. Traefik and most
# load balancers set X-Forwarded-For and X-Forwarded-Proto by themselves.

upstream webfast {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    location / {
        proxy_pass http://webfast;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Event streams and large files flow through as they come.
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 308 https://$host$request_uri;
}
